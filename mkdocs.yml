---
# Site information
site_name: op_system Documentation
site_url: https://accidda.github.io/op_system/

# Repository information
repo_name: ACCIDDA/op_system
repo_url: https://github.com/ACCIDDA/op_system
edit_uri: ''

# Theme information
theme:
  name: material
  custom_dir: overrides

# Plugins
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            heading_level: 2

# Extras
extra:
  version:
    provider: mike

# Markdown extensions
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - attr_list
  - pymdownx.snippets:
      base_path: .
      check_paths: true

# Navigation structure
nav:
  - Home: index.md
  - Capabilities and example checks: guides/capabilities.md
  - Development:
      - Execution Roadmap: development/execution-roadmap.md
      - Contributing: development/contributing.md
      - Coverage Audit: development/coverage-audit.md
      - Cache Lifetimes: development/cache-lifetimes.md
      - Code Style: development/code-style.md
      - Creating A Release: development/creating-a-release.md
      - Citation and Archiving: development/citation-and-archiving.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Parameter Declarations: guides/parameter-declarations.md
      - Structural Model Identity: guides/structural-identity.md
      - Portable IR and Derivatives: guides/portable-ir.md
      - Dependency Structure: guides/dependency-structure.md
      - Native State Actions: guides/native-actions.md
      - State Representations: guides/state-representations.md
      - Conditional Reaction Balances: guides/reaction-balances.md
      - Latent Observables: guides/latent-observables.md
      - Expression Selectors: guides/expression-selectors.md
      - Named Kernel Products: guides/named-kernel-products.md
      - Scaling Gauges: guides/scaling-gauges.md
      - Log State Coordinates: guides/log-state-coordinates.md
      - Global State Totals: guides/global-state-totals.md
      - Operator Metadata: guides/operators.md
      - Time-indexed Parameters: guides/time-indexed-parameters.md
      - Renewal Births: guides/renewal-births.md
      - Aging Chains: guides/aging-chains.md
      - Independent Batches: guides/batched-models.md
      - Array Namespaces: guides/array-namespaces.md
      - Backend Qualification: guides/backend-qualification.md
      - CuPy Device Qualification: guides/cupy.md
      - GPU workstation handoff: guides/gpu-workstation.md
      - Numerical Qualification: guides/numerical-qualification.md
      - Hierarchical Benchmarks: guides/hierarchical-benchmarks.md
      - Evaluator Overhead: guides/evaluator-overhead.md
      - Optional Numba: guides/numba.md
  - API Reference:
      - OP System: api-reference/op-system.md
      - Actions: api-reference/actions.md
      - Balances: api-reference/balances.md
      - Compile: api-reference/compile.md
      - Coordinates: api-reference/coordinates.md
      - Dependencies: api-reference/dependencies.md
      - Gauges: api-reference/gauges.md
      - Identity: api-reference/identity.md
      - Numba: api-reference/numba.md
      - Observables: api-reference/observables.md
      - Portable: api-reference/portable.md
