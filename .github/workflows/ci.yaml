---
name: 'ci'

'on':
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  numba-optional:
    name: 'optional Numba (${{ matrix.contract }}, ${{ matrix.python }})'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {contract: 'minimum', python: '3.12'}
          - {contract: 'current', python: '3.11'}
          - {contract: 'current', python: '3.12'}
          - {contract: 'current', python: '3.13'}
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7'
        with:
          python-version: '${{ matrix.python }}'
      - name: 'Install required optional compiler'
        run: |
          uv venv --python '${{ matrix.python }}'
          if [ '${{ matrix.contract }}' = minimum ]; then
            uv pip install -e '.[numba]' pytest 'sybil[pytest]>=9.2' 'numba==0.67.0' 'numpy==2.0.2'
          else
            uv pip install -e '.[numba]' pytest 'sybil[pytest]>=9.2'
          fi
      - name: 'Require native values, layout and errors without skips'
        run: 'uv run --no-sync python scripts/qualify_backend.py numba'
  torch-minimum:
    name: 'compiler minimum Torch (3.12)'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7'
        with:
          python-version: '3.12'
      - name: 'Install minimum native array contracts'
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest 'sybil[pytest]>=9.2' 'numpy==2.0.2' 'array-api-compat==1.12.0' 'pydantic==2.12.5'
          uv pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: 'Require device placement and native derivative graphs'
        run: |
          uv run --no-sync python -c 'import torch; assert torch.__version__.split("+")[0] == "2.6.0"'
          uv run --no-sync pytest tests/op_system/test_scalar_device.py tests/op_system/test_portable_symbolic.py -k torch -q
  provider-typing:
    name: 'provider-typing'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          python-version: '3.12'
      - name: 'qualify installed provider types'
        run: |
          uv sync --dev
          just provider-sync
          just build-test-provider
        env:
          UV_PYTHON_VERSION: '3.12'
  citation:
    name: 'citation'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          python-version: '3.12'
      - name: 'validate citation syntax and released metadata'
        run: 'just citation'
  compiler-backends:
    name: 'compiler (${{ matrix.backend }}, 3.12)'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        backend: ['numpy', 'jax', 'torch']
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'install selected core backend'
        run: |
          uv sync --dev
          case '${{ matrix.backend }}' in
            jax) uv sync --dev --extra jax ;;
            torch) uv pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu ;;
          esac
      - name: 'qualify selected backend without skips'
        run: 'uv run --no-sync python scripts/qualify_backend.py ${{ matrix.backend }}'
  docs:
    name: 'docs'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'build documentation'
        run: 'just docs'
        env:
          UV_PYTHON_VERSION: '3.12'
  quality:
    name: 'quality'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'run quality checks'
        run: 'just quality'
        env:
          UV_PYTHON_VERSION: '3.12'
  build-check:
    name: 'build-check'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'run build validation'
        run: 'just build-check'
        env:
          UV_PYTHON_VERSION: '3.12'
  tests:
    name: 'tests (${{ matrix.python-version }})'
    needs:
      - 'quality'
      - 'docs'
      - 'build-check'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'run test suite'
        run: 'just test'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
