---
name: 'ci'

'on':
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  citation:
    name: 'citation'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          python-version: '3.12'
      - name: 'validate citation syntax and released metadata'
        run: 'just citation'
  compiler-backends:
    name: 'compiler (${{ matrix.backend }}, 3.12)'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        backend: ['numpy', 'jax', 'torch']
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'install selected core backend'
        run: |
          uv sync --dev
          case '${{ matrix.backend }}' in
            jax) uv sync --dev --extra jax ;;
            torch) uv pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu ;;
          esac
      - name: 'qualify selected backend without skips'
        run: 'uv run --no-sync python scripts/qualify_backend.py ${{ matrix.backend }}'
  docs:
    name: 'docs'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'build documentation'
        run: 'just docs'
        env:
          UV_PYTHON_VERSION: '3.12'
  quality:
    name: 'quality'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'run quality checks'
        run: 'just quality'
        env:
          UV_PYTHON_VERSION: '3.12'
  build-check:
    name: 'build-check'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.12'
      - name: 'run build validation'
        run: 'just build-check'
        env:
          UV_PYTHON_VERSION: '3.12'
  tests:
    name: 'tests (${{ matrix.python-version }})'
    needs:
      - 'quality'
      - 'docs'
      - 'build-check'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'run test suite'
        run: 'just test'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
